<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact CleanMyX for support, questions, or feedback.">
  <title>Contact | CleanMyX</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.7; color: #202636; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 20px; }
    main { max-width: 780px; margin: auto; padding: 40px; background: #fff; border: 1px solid #dce2ec; border-radius: 20px; }
    .brand { margin: 0; color: #3856bc; font-weight: 700; letter-spacing: .04em; }
    h1 { margin: 8px 0 28px; font-size: clamp(2rem, 6vw, 2.75rem); line-height: 1.2; }
    p { margin: 0 0 16px; }
    a { color: #3856bc; text-underline-offset: 3px; overflow-wrap: anywhere; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
    .button { display: inline-block; padding: 12px 24px; margin: 8px 0 20px; border-radius: 10px; background: #3856bc; color: #fff; font-weight: 600; text-decoration: none; }
    .button:hover { background: #2b4296; }
    footer { display: flex; flex-wrap: wrap; gap: 12px 24px; margin-top: 32px; padding-top: 20px; border-top: 1px solid #dce2ec; }
    @media (max-width: 520px) { body { padding: 16px 12px; } main { padding: 26px 20px; border-radius: 14px; } }
    @media (prefers-color-scheme: dark) { :root { color: #e5e9f2; background: #10141d; } main { background: #191f2b; border-color: #343e50; } .brand, a { color: #a6b8ff; } .button { background: #a6b8ff; color: #10141d; } .button:hover { background: #c2ceff; } footer { border-color: #343e50; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="brand">CleanMyX</p>
      <h1>Contact Us</h1>
      <p>Have a question, need support, or want to share feedback? Send us an email.</p>
    </header>
    <a class="button" href="mailto:code.and.play.vn@gmail.com?subject=CleanMyX%20Support">Email Us</a>
    <p>This button opens your email app. You can also email us at <a href="mailto:code.and.play.vn@gmail.com">code.and.play.vn@gmail.com</a>.</p>
    <footer>
      <a href="x_clean_tos.html">Terms of Use</a>
      <a href="x_clean_privacy.html">Privacy Policy</a>
    </footer>
  </main>
</body>
</html>
